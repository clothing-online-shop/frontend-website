name: CI

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

jobs:
  lint-build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "pnpm"

      - run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      # generateStaticParams tự bắt lỗi và trả [] nếu backend-user không gọi được,
      # nên build vẫn chạy được trong CI mà không cần backend thật đứng cạnh.
      - name: Build
        run: pnpm build

  # Deploy job — cần điền secret của nơi host thật (Vercel/VPS...) trước khi bật.
